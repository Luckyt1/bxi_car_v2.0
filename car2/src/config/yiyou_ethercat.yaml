# 工控机上的意优 EtherCAT 专用实体网口；lo 不是实体网口。
# 含机械臂的主程序默认加载本文件；--params-file 和 -p 可覆盖参数。
chassis:
  ros__parameters:
    yiyou_ethercat_interface: "enp86s0"
    # 四轴 PP；第四轴保持实际启动位置，不自动回零或回到软件边界。
    yiyou_ethercat_slaves: [1, 2, 3, 4]
    # 第四轴按住 button0/button4 正反点动，松手减速停止并保持。
    # 输出轴 12 RPM = 72 度/秒；目标限制 0..1200 度，越界时仅允许向内返回。
    yiyou_motor_4_speed_rpm: 12.0
    yiyou_motor_4_acceleration_rpm_s: 24.0
    # 第四轴多圈角度记录默认在工程 state/yiyou_motor4_position.yaml，调试工具共用。
    # 可用非空绝对路径参数 yiyou_motor_4_position_memory_file 覆盖；断电期间轴必须不动。
    # 前三轴依次为肩、肘、腕；编码器 0 对应仿真 q=[0,0,0]。
    # 正关节角绕 -Y；按实机安装核对电机正方向，反向轴填 -1。
    yiyou_arm_motor_directions: [1, -1, 1]
    yiyou_arm_zero_counts: [0, 0, 0]
    # 空路径使用与仿真一致的内置 300/400 mm、[150,-150,0]° 几何配置。
    # 可指定同目录的 arm_kinematics.json 或仿真使用的 arm.json。
    yiyou_arm_kinematics_file: ""
    yiyou_arm_speed_rpm: 0.6
    yiyou_arm_acceleration_rpm_s: 1.0
    # 上电初始化后回到已保存的三轴零位；不设零或写 EEPROM。
    # 设为 false 时保持启动位置。回零到位后才校准底盘并开放遥控。
    yiyou_arm_home_on_start: true
    # 运行后设置 yiyou_arm_target=[x米,z米,pitch弧度]。

remote_ctrl:
  ros__parameters:
    arm_position_topic: "/arm_motor4_jog"
