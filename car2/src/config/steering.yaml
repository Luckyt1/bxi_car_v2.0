# 日常调参：修改后重启程序生效。x 向前，y 向左，yaw 逆时针。
# 轮速、整车限速和遥控速度共同限制最终速度；增大遥控速度不会越过轮速上限。
chassis:
  ros__parameters:
    # 同目录硬件配置：CAN、机械尺寸、方向、校准、驱动器内部参数。
    hardware_config_file: steering_hardware.yaml

    # 四个行走轮统一设置（输出轴 RPM；轮缘加减速度 m/s²）。
    drive_max_output_rpm: 105.0
    drive_acceleration_m_s2: 2.0
    drive_deceleration_m_s2: 2.4

    # 舵轮转向角速度 rad/s；整车 yaw 变化率 rad/s²。
    steering_rate_limit_rad_s: 4.0
    command_yaw_acceleration_rad_s2: 0.8

    # 整车 x/y/yaw 速度绝对值上限，适用于遥控和 /cmd_vel_car。
    # 0 保持原行为（仅受轮速限制）；设为正数启用，例如 0.6、0.6、0.4。
    # 任一方向超限时，x/y/yaw 同比例缩小，保持运动方向与转弯比例。
    max_velocity_x_m_s: 0.0
    max_velocity_y_m_s: 0.0
    max_velocity_yaw_rad_s: 0.0

remote_ctrl:
  ros__parameters:
    # 遥控满杆 x/y 速度 m/s、yaw 角速度 rad/s。
    scale_linear: 0.6
    scale_lateral: 0.6
    scale_angular: 0.4
    # 遥控 x/y 指令变化率 m/s²，沿用现有算法：正向变化 / 负向变化。
    max_accel: 1.2
    max_decel: 2.4
