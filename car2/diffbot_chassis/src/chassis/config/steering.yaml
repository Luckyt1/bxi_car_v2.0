chassis:
  # 内置备注在自动保存时重新生成。
  ros__parameters:

    # ==================== 通信映射与 CANopen 反馈 ====================
    # 通信总线配置：CAN0 上挂四个转向轴；行走轴使用 drive_can_buses 指定。
    can_bus: 0
    # 四个行走轴 CAN 总线，顺序 FL 前左、RL 后左、RR 后右、FR 前右。
    drive_can_buses: [1, 1, 2, 2]
    # 四个转向轴 Node-ID，顺序 FL 前左、RL 后左、RR 后右、FR 前右，范围 1..127。
    node_ids: [1, 2, 3, 4]
    # 四个行走轴 Node-ID，顺序 FL 前左、RL 后左、RR 后右、FR 前右，范围 1..127。
    drive_node_ids: [1, 2, 3, 4]
    # RPDO 传输类型，raw CANopen 值。
    rpdo_transmission_type: 254
    # TPDO 传输类型，raw CANopen 值。
    tpdo_transmission_type: 254
    # TPDO 抑制时间，单位 0.1 ms。
    tpdo_inhibit_time: 0
    # TPDO 事件周期，单位 ms。
    tpdo_event_timer_ms: 10

    # ==================== 底盘尺寸与机械参数 ====================
    # 底盘前后轮中心距离，单位 m。
    wheel_base_m: 0.41999999999999998
    # 底盘左右轮中心距离，单位 m。
    track_width_m: 0.35999999999999999
    # 行走轮直径，单位 m。
    wheel_diameter_m: 0.13
    # 转向电机编码器每转计数。
    encoder_resolution: 65536
    # 转向电机到舵轮输出轴减速比。
    gear_ratio: 9.0252707580999996
    # 行走电机编码器每转计数。
    drive_encoder_resolution: 65536
    # 行走电机到车轮输出轴减速比。
    drive_gear_ratio: 10
    # 舵轮目标角度最大绝对值，单位 rad。
    max_steering_angle_rad: 3.1415926535897931
    # 车体前进方向到转向零位的角度偏置，单位 rad。
    steering_forward_offset_rad: 1.5707963267948966
    # 四个转向轴方向反转，顺序 FL 前左、RL 后左、RR 后右、FR 前右。
    inverted: [true, true, true, true]
    # 四个行走轴方向反转，顺序 FL 前左、RL 后左、RR 后右、FR 前右。
    drive_inverted: [false, false, true, true]
    # 四个转向轴校准中位编码器计数，顺序 FL 前左、RL 后左、RR 后右、FR 前右。
    zero_offset_inc: [135251, 99572, -245279, -155865]

    # ==================== 运动控制 ====================
    # 转向位置模式最大电机转速，单位 rpm。
    profile_velocity_rpm: 200
    # 转向位置模式加速度，单位 rps^2。
    acceleration_rps2: 100
    # 转向位置模式减速度，单位 rps^2。
    deceleration_rps2: 100
    # 行走轮输出轴转速上限，单位 rpm。
    drive_max_output_rpm: 105
    # 行走轮输出轴加速度限制，单位 rpm/s。
    drive_acceleration_rpm_s: 60
    # 行走轮输出轴减速度限制，单位 rpm/s。
    drive_deceleration_rpm_s: 120
    # 转向误差容差，供对齐/回中判定；具体行走限制由 drive_alignment_policy 决定。
    drive_steering_tolerance_rad: 0.10000000000000001
    # 连续转向时避开软限位的角度余量，单位 rad。
    steering_limit_margin_rad: 0.087266462599999997
    # 转向目标角速度限制，单位 rad/s。
    steering_rate_limit_rad_s: 2
    # 旧控制器对齐停车阈值，单位 rad；Swerve 使用 drive_alignment_policy 和 drive_alignment_pause_rad。
    drive_alignment_stop_rad: 0.5
    # Swerve 低速判定阈值，单位 m/s。
    swerve_speed_epsilon_m_s: 0.0001
    # Swerve 角度分支切换迟滞，单位 rad。
    swerve_branch_hysteresis_rad: 0.0
    # 转向未对齐时行走输出策略：none 不限制，cosine 按转角减速，pause_all 未对齐先停。
    drive_alignment_policy: none
    # pause_all 策略的转向误差暂停阈值，单位 rad。
    drive_alignment_pause_rad: 0.34999999999999998
    # 遥控旋转速度变化率限制，单位 rad/s^2。
    command_yaw_acceleration_rad_s2: 0.80000000000000004

    # ==================== 转向内部参数 ====================
    # null 表示启动时读取驱动器实际值并回填 YAML；数值会写入驱动器，下次启动继续使用。
    # 调参数组顺序：FL 前左、RL 后左、RR 后右、FR 前右。
    # 转向 0x60F9:01 速度环 Kp，raw，组 0，范围 1..32767；数组顺序 FL/RL/RR/FR。
    steering_velocity_loop_kp:
      - 4
      - 4
      - 4
      - 4
    # 转向 0x60F9:02 速度环 Ki，raw，组 0，范围 0..1023；Ki=0 不代表全部积分关闭，另有 0x60F9:07。
    steering_velocity_loop_ki:
      - 0
      - 0
      - 0
      - 0
    # 转向 0x60F9:05 速度反馈滤波带宽 raw*20+100 Hz（非 CAN 读取频率），范围 0..45。
    steering_velocity_feedback_filter:
      - 7
      - 7
      - 7
      - 7
    # 转向 0x60FB:01 位置环 Kp，raw，对应 raw*0.01 Hz，组 0，范围 0..32767。
    steering_position_loop_kp:
      - 1000
      - 1000
      - 1000
      - 1000
    # 转向 0x60FB:05 位置平滑滤波 raw，范围 1..255；越大越平滑且延迟增大。
    steering_position_smoothing_filter:
      - 1
      - 1
      - 1
      - 1

    # ==================== 行走内部参数 ====================
    # null 表示启动时读取驱动器实际值并回填 YAML；数值会写入驱动器，下次启动继续使用。
    # 调参数组顺序：FL 前左、RL 后左、RR 后右、FR 前右。
    # 行走 0x60F9:01 速度环 Kp，raw，组 0，范围 1..32767；数组顺序 FL/RL/RR/FR。
    drive_velocity_loop_kp:
      - 32
      - 32
      - 32
      - 32
    # 行走 0x60F9:02 速度环 Ki，raw，组 0，范围 0..1023；Ki=0 不代表全部积分关闭，另有 0x60F9:07。
    drive_velocity_loop_ki:
      - 1
      - 1
      - 1
      - 1
    # 行走 0x60F9:05 速度反馈滤波带宽 raw*20+100 Hz（非 CAN 读取频率），范围 0..45。
    drive_velocity_feedback_filter:
      - 7
      - 7
      - 7
      - 7
    # 行走 0x60FB:01 位置环 Kp，raw，对应 raw*0.01 Hz，组 0，范围 0..32767。
    drive_position_loop_kp:
      - 1000
      - 1000
      - 1000
      - 1000
    # 行走 0x60FB:05 位置平滑滤波 raw，范围 1..255；越大越平滑且延迟增大。
    drive_position_smoothing_filter:
      - 1
      - 1
      - 1
      - 1

    # ==================== 校准 ====================
    # 四轮转向校准完成标记。
    steering_calibrated: true
    # 校准电机轴转速保护上限，单位 rpm。
    calibration_speed_rpm: 500
    # 校准搜索目标速度，舵轮输出轴单位 rpm。
    calibration_search_speed_rpm: 8
    # 兼容保留字段，按原值保存。
    calibration_torque_percent: 10
    # 校准估算输出力矩安全上限，单位 N*m。
    calibration_torque_limit_nm: 25
    # 校准限位接触判定输出力矩，单位 N*m。
    calibration_contact_torque_nm: 1
    # 两侧限位最小角距离，单位 rad。
    calibration_min_limit_separation_rad: 3.1415926535897931
    # 回中位置允许编码器误差，单位 inc。
    calibration_position_epsilon_inc: 64
    # 兼容保留字段，按原值保存。
    calibration_stall_time_s: 0
    # 兼容保留字段，按原值保存，单位 A。
    calibration_current_threshold_a: 0.050000000000000003
    # 兼容保留字段，按原值保存，单位 A。
    calibration_current_rise_a: 1.5
    # 每个校准阶段搜索超时，单位 s。
    calibration_timeout_s: 230
    # 兼容保留字段，按原值保存。
    calibration_node_id: 1
    # 兼容开关，必须保持 false；true 会被配置校验拒绝。
    calibration_ignore_drive_fault: false
    # 转向电机最大电流，单位 Arms。
    motor_peak_current_a: 14.300000000000001
    # 转向电机力矩常数，单位 N*m/Arms。
    motor_torque_constant_nm_per_a: 0.1153846154

    # ==================== 模块逐轮配置 ====================
    # 四个模块逐轮配置，顺序 FL/RL/RR/FR；字段含 x/y 位置 m、轮半径 m、转向/行走减速比、编码器、方向、软限位、速率和加减速度。
    modules:
      - x_m: 0.20999999999999999
        y_m: 0.17999999999999999
        wheel_radius_m: 0.065000000000000002
        steering_gear_ratio: 9.0252707580999996
        steering_encoder_resolution: 65536
        steering_sign: 1
        heading_offset_rad: -1.5707963267948966
        steering_min_rad: -3.1415926535897931
        steering_max_rad: 3.1415926535897931
        soft_margin_rad: 0.087266462599999997
        drive_gear_ratio: 10
        drive_encoder_resolution: 65536
        steering_inverted: true
        drive_inverted: false
        drive_max_motor_rpm: 1050
        steering_rate_limit_rad_s: 2
        drive_acceleration_m_s2: 0.40840704496667313
        drive_deceleration_m_s2: 0.81681408993334625
      - x_m: -0.20999999999999999
        y_m: 0.17999999999999999
        wheel_radius_m: 0.065000000000000002
        steering_gear_ratio: 9.0252707580999996
        steering_encoder_resolution: 65536
        steering_sign: 1
        heading_offset_rad: -1.5707963267948966
        steering_min_rad: -3.1415926535897931
        steering_max_rad: 3.1415926535897931
        soft_margin_rad: 0.087266462599999997
        drive_gear_ratio: 10
        drive_encoder_resolution: 65536
        steering_inverted: true
        drive_inverted: false
        drive_max_motor_rpm: 1050
        steering_rate_limit_rad_s: 2
        drive_acceleration_m_s2: 0.40840704496667313
        drive_deceleration_m_s2: 0.81681408993334625
      - x_m: -0.20999999999999999
        y_m: -0.17999999999999999
        wheel_radius_m: 0.065000000000000002
        steering_gear_ratio: 9.0252707580999996
        steering_encoder_resolution: 65536
        steering_sign: 1
        heading_offset_rad: -1.5707963267948966
        steering_min_rad: -3.1415926535897931
        steering_max_rad: 3.1415926535897931
        soft_margin_rad: 0.087266462599999997
        drive_gear_ratio: 10
        drive_encoder_resolution: 65536
        steering_inverted: true
        drive_inverted: true
        drive_max_motor_rpm: 1050
        steering_rate_limit_rad_s: 2
        drive_acceleration_m_s2: 0.40840704496667313
        drive_deceleration_m_s2: 0.81681408993334625
      - x_m: 0.20999999999999999
        y_m: -0.17999999999999999
        wheel_radius_m: 0.065000000000000002
        steering_gear_ratio: 9.0252707580999996
        steering_encoder_resolution: 65536
        steering_sign: 1
        heading_offset_rad: -1.5707963267948966
        steering_min_rad: -3.1415926535897931
        steering_max_rad: 3.1415926535897931
        soft_margin_rad: 0.087266462599999997
        drive_gear_ratio: 10
