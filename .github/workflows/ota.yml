name: Build and publish car2 OTA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: car2-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    container: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      ROS_LOCALHOST_ONLY: '1'
      ROS_DOMAIN_ID: '207'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            build-essential cmake git ca-certificates python3-yaml python3-matplotlib libyaml-cpp-dev \
            ros-humble-ament-cmake ros-humble-rclcpp ros-humble-rclpy \
            ros-humble-rcl-interfaces ros-humble-geometry-msgs ros-humble-std-msgs \
            ros-humble-yaml-cpp-vendor

      - name: Test publisher without external services
        run: python3 -m unittest discover -s scripts -p 'test_publish_ota.py' -v

      - name: Configure and compile
        run: |
          source /opt/ros/humble/setup.bash
          cmake -S car2 -B .ci/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.ci/install"
          cmake --build .ci/build --parallel 2

      - name: Run offline controller tests
        run: |
          source /opt/ros/humble/setup.bash
          ctest --test-dir .ci/build --output-on-failure --parallel 2

      - name: Install and package
        id: package
        run: |
          source /opt/ros/humble/setup.bash
          test "$GITHUB_RUN_ATTEMPT" -lt 1000
          revision=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          version="v$(date -u +%y%m%d)-$revision"
          cmake --install .ci/build
          python3 car2/scripts/package_ota.py \
            --install-prefix .ci/install --output-dir dist --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Retain installation archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: car2-x86_64-${{ steps.package.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish main to the OTA download site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          OTA_USERNAME: ${{ secrets.OTA_USERNAME }}
          OTA_PASSWORD: ${{ secrets.OTA_PASSWORD }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          current_main="$(timeout 30 git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo '::notice::A newer main commit exists; this archive will not replace its OTA release.'
            exit 0
          fi
          python3 scripts/publish_ota.py \
            --archive "dist/car2_${RELEASE_VERSION}.tar.gz" \
            --checksum "dist/car2_${RELEASE_VERSION}.tar.gz.sha256" \
            --remote-dir /ELF3/bxi_arm_car2

      - name: Retain test diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: car2-test-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: .ci/build/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 30
